name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum

      - name: Test
        run: make test

      - name: Vet
        run: make lint

      - name: Build
        run: make build

      - name: Verify GitHub Actions are pinned
        run: go tool pinact run -check -verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    name: Install And Doctor
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.3
          cache-dependency-path: go.sum

      - name: Run install, doctor, and idempotency check
        run: scripts/ci/integration.sh
